<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParkSmart</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🚗 ParkSmart</h1>
        <p>Smart Parking Slot Booking System</p>
    </header>

    <div class="container">

        <div class="card">
            <h2>Parking Overview</h2>
            <p>Total Slots: <strong id="totalSlots">-</strong></p>
            <p>Available Slots: <strong id="availableSlots">-</strong></p>
            <p>Occupied Slots: <strong id="occupiedSlots">-</strong></p>
        </div>

        <div class="card">
            <h2>Parking Slots</h2>

            <div id="slots" class="slots">
                <p>Loading slots...</p>
            </div>
        </div>

    </div>
            <div class="card">
            <h2>Book a Parking Slot</h2>

            <label>Vehicle Number</label>
            <input type="text" id="vehicleNumber" placeholder="TN38AB1234">

            <label>Select Slot</label>
            <select id="slotId">
                <option value="">Select a slot</option>
            </select>

            <label>Start Time</label>
            <input type="datetime-local" id="startTime">

            <label>End Time</label>
            <input type="datetime-local" id="endTime">

            <br><br>

            <button onclick="bookSlot()">Book Slot</button>

            <p id="bookingMessage"></p>
        </div>

</body>
<div class="card">
    <h2>Check-In / Check-Out</h2>

    <label>Booking ID</label>
    <input type="number" id="checkInBookingId" placeholder="Enter Booking ID">

    <button onclick="checkIn()">Check In</button>

    <br><br>

    <label>Check-In Record ID</label>
    <input type="number" id="checkOutId" placeholder="Enter Check-In ID">

    <button onclick="checkOut()">Check Out</button>

    <p id="checkMessage"></p>
</div>
<script src="script.js"></script>

</html>
